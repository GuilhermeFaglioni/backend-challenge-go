name: Publish

# Publishes the multi-arch image to GitHub Container Registry:
#   - after the CI workflow succeeds on a push to main (sha-<short> and latest);
#   - when a vX.Y.Z tag is pushed (sha-<short>, X.Y.Z and X.Y).
# It never runs for pull requests and never when CI failed.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# The only workflow-level permission; the publish job asks for more, alone.
permissions:
  contents: read

# One publish per commit, never cancelled half way through a push to the registry.
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish image
    # workflow_run fires for every CI outcome and for pull request runs too;
    # only a successful run triggered by a push to main may publish.
    if: >-
      github.event_name == 'push' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write # push to ghcr.io; the only job in the repository with this
      actions: read # look up the CI run of a tagged commit
    env:
      # For workflow_run, GITHUB_SHA is the latest commit on main, which may be
      # newer than the one CI validated; publish exactly what CI validated.
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      # A tag can be pushed on any commit, so check that CI went green on the
      # exact commit being released.
      - name: Require a green CI run for the tagged commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          count=$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=${COMMIT_SHA}&event=push&status=success" --jq '.total_count')
          if [ "$count" -lt 1 ]; then
            echo "No successful CI run for ${COMMIT_SHA}: refusing to publish a release from it." >&2
            exit 1
          fi

      # Two quick merges can finish CI out of order, and CI can be re-run on an
      # old commit. Only the commit that is still the head of main may move latest.
      - name: Check whether this commit is still the head of main
        id: head
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          main_head=$(gh api "repos/${REPO}/commits/main" --jq '.sha')
          if [ "$main_head" = "$COMMIT_SHA" ]; then
            echo "move_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "move_latest=false" >> "$GITHUB_OUTPUT"
            echo "main moved on to ${main_head}; publishing the sha tag only."
          fi

      - name: Compute image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          MOVE_LATEST: ${{ steps.head.outputs.move_latest }}
        run: |
          {
            echo 'refs<<TAGS_END'
            bash .github/scripts/image-tags.sh
            echo 'TAGS_END'
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.refs }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

      # Pulling works on both architectures only if the pushed manifest list
      # really has both: check the registry, not the build's intent.
      - name: Verify the published manifest
        env:
          REFS: ${{ steps.tags.outputs.refs }}
        run: |
          ref=$(head -n 1 <<<"$REFS")
          manifest=$(docker buildx imagetools inspect "$ref")
          for platform in linux/amd64 linux/arm64; do
            # An optional variant suffix (linux/arm64/v8) is still that platform.
            if ! grep -Eq "Platform: *${platform}(/[a-z0-9]+)?\$" <<<"$manifest"; then
              echo "Missing ${platform} in ${ref}" >&2
              exit 1
            fi
          done
          echo "Published ${ref} with linux/amd64 and linux/arm64"
