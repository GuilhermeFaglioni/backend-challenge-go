name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; a job that needs more declares it itself.
permissions:
  contents: read

# A new push to a PR cancels the run in progress. Runs on main are never
# cancelled, so a later merge cannot interrupt the validation of an earlier one.
# Outside PRs the group is per commit: with a shared group GitHub would still
# drop a *pending* run when a newer one queues behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Format, vet and modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted (run 'gofmt -w .'):"
            echo "$unformatted"
            exit 1
          fi

      # Once per build tag: tagged code is invisible to a plain vet.
      - name: go vet
        run: |
          go vet ./...
          go vet -tags integration ./...
          go vet -tags multiinstance ./...
          go vet -tags faultinject ./...

      - name: Script self-tests
        run: |
          bash .github/scripts/pr-title_test.sh
          bash .github/scripts/image-tags_test.sh
          bash .github/scripts/nightly-report_test.sh

      - name: go mod tidy
        # -diff prints what tidy would change and fails without touching files;
        # unlike git diff it also catches a go.sum that is missing altogether.
        run: |
          if ! go mod tidy -diff; then
            echo "go.mod/go.sum are not tidy (run 'go mod tidy' and commit the result)."
            exit 1
          fi

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # -shuffle=on prints a seed per package ("-test.shuffle <seed>"); rerun a
      # failure locally with -shuffle=<seed>. -v makes passing packages show it too.
      - name: go test
        run: go test -race -count=1 -shuffle=on -v ./...

      # Fault points exist only in this build; their behaviour must be tested too.
      - name: go test (faultinject build)
        run: go test -race -count=1 -shuffle=on -tags faultinject ./internal/platform/faultinject/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Linters and their configuration live in .golangci.yml.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

  vulncheck:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Reports only vulnerabilities in code the program can actually reach.
      # Pinned version: the module proxy verifies it against the checksum database.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    name: Image (multi-arch build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Not pushed here (publishing is a separate workflow). No QEMU: the
      # Dockerfile cross-compiles on the builder's architecture and the final
      # stage has no RUN instruction, so nothing executes under emulation.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max

  smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_IMAGE: wagering-app:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image runs on this runner, so only its architecture is built (and
      # loaded into the local Docker daemon). The multi-arch build is the
      # `image` job.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.APP_IMAGE }}
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max

      - name: Start the stack
        run: docker compose up -d --no-build

      - name: Smoke test
        run: bash .github/scripts/smoke.sh

      # cancelled() too: the job timeout cancels the job, and failure() is false then.
      - name: Collect logs
        if: failure() || cancelled()
        run: docker compose logs --no-color --timestamps > compose-logs.txt

      - name: Upload logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compose-logs
          path: compose-logs.txt
          retention-days: 7
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # On failure the test harness writes each container's log here.
      INTEGRATION_LOG_DIR: ${{ github.workspace }}/integration-logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Real PostgreSQL, LocalStack and Keycloak in containers (testcontainers).
      # ./... so an integration test added to any package is picked up; the
      # unit tests run again here, which costs seconds. -timeout is just above
      # the harness watchdog (12m), so a hung run still saves the container logs.
      - name: go test (integration)
        run: go test -tags integration -race -count=1 -shuffle=on -timeout 14m -v ./...

      # cancelled() too: the job timeout cancels the job, and failure() is false then.
      - name: Upload container logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-logs
          path: integration-logs
          retention-days: 7
          if-no-files-found: ignore

  multi-instance:
    name: Multi-instance tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # On failure the harness writes each container's and each instance's log here.
      INTEGRATION_LOG_DIR: ${{ github.workspace }}/integration-logs
      # Coverage data the instrumented processes write when they exit cleanly.
      MULTIINSTANCE_COVERDIR: ${{ github.workspace }}/coverage-multiinstance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Three-plus real OS processes of the application (built with the race
      # detector, coverage and fault points) against real PostgreSQL and
      # LocalStack. -timeout is just above the harness watchdog (12m).
      - name: go test (multi-instance)
        run: go test -tags multiinstance -race -count=1 -shuffle=on -timeout 14m -v ./test/multiinstance/

      # cancelled() too: the job timeout cancels the job, and failure() is false then.
      - name: Upload container and instance logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multi-instance-logs
          path: integration-logs
          retention-days: 7
          if-no-files-found: ignore
