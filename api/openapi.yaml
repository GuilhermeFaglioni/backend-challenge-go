openapi: 3.0.3
info:
  title: Wagering API
  version: 0.1.0
  description: |
    Wallets and wagering transactions of the distributed betting backend.

    Every endpoint except the health checks and this document requires a bearer
    token obtained from Keycloak with the OAuth 2.0 `client_credentials` grant. The
    role the token carries (`provider`, `internal` or `monitoring`) decides what it
    may call; the role is listed on each operation.

    This file is written by hand and is the source of truth of the HTTP contract:
    the integration tests validate every real request and response against it.
servers:
  - url: http://localhost:8081
    description: Instance app-1 of the local Compose environment
  - url: http://localhost:8082
    description: Instance app-2
  - url: http://localhost:8083
    description: Instance app-3

tags:
  - name: Wagering
    description: Operations sent by game providers. Role `provider`.
  - name: Wallets
    description: Opening and reading wallets. Role `internal`.
  - name: Operations
    description: Health checks and this document, with no credentials; the metrics, with role `monitoring`.

security:
  - clientCredentials: []

paths:
  /wagering/transactions:
    post:
      tags: [Wagering]
      operationId: submitOperation
      summary: Submit an operation
      description: |
        Processes an operation of a game provider on a player's wallet. Role `provider`.

        The provider is the one the token says it is: `providerId` in the body must be
        the token's, otherwise the request is refused with `403` before anything
        happens. A provider never reads or replays another provider's operations.

        `Idempotency-Key` is required and is kept exactly as received. Sending the same
        key and content again answers with the stored result and `idempotentReplay: true`,
        with the balance seen when the operation was first processed. The same key with
        other content is `409 IDEMPOTENCY_KEY_CONFLICT`; the same `externalTransactionId`
        under another key is `409 DUPLICATE_EXTERNAL_TRANSACTION`, and nothing is applied.

        A business refusal (insufficient funds, a wallet that does not exist, a player or
        currency that does not match) is a stored, final result: `422` with a
        `failureCode`. Sending it again returns the same `422`; to correct it, send a new
        operation with a new key and external id.

        Every kind is processed. `REFUND` and `ROLLBACK` (the Reversals) name the operation
        they reverse in `referenceExternalTransactionId`, which is looked for among the
        provider's own transactions. The Reference decides, in this order: not found yet (the
        operation waits: `202`), ended without success (`REFERENCE_NOT_PROCESSED`), a kind this
        cannot act on (`REFERENCE_KIND_INVALID`), another player, wallet, currency or round
        (`REFERENCE_MISMATCH`), another amount (`REFERENCE_AMOUNT_MISMATCH`), already reversed
        (`REFERENCE_ALREADY_REVERSED`). A reversal that would take the balance below zero is
        `REVERSAL_INSUFFICIENT_FUNDS`. A `WIN` may name the `BET` it pays, of the same round, and
        is never a Reversal. A Reference that has not arrived is waited for (`202`, see below); all the other refusals are stored `422` results. `OPENING` is reserved to the
        internal opening of a wallet and is always `400`.

        A `LOSS` moves no money: it answers `200` with the wallet's balance, writes no
        ledger entry and leaves the wallet's version as it was.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
            examples:
              bet:
                summary: A bet of 25.00 BRL
                value:
                  providerId: provider-a
                  externalTransactionId: transaction-123
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  walletId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  roundId: round-987
                  gameId: fortune-chimp
                  kind: BET
                  money: { amount: '25.00', currency: BRL }
              win:
                summary: A prize of 100.00 BRL
                value:
                  providerId: provider-a
                  externalTransactionId: transaction-124
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  walletId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  roundId: round-987
                  gameId: fortune-chimp
                  kind: WIN
                  money: { amount: '100.00', currency: BRL }
              refund:
                summary: Giving the bet of 25.00 BRL back
                value:
                  providerId: provider-a
                  externalTransactionId: transaction-126
                  referenceExternalTransactionId: transaction-123
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  walletId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  roundId: round-987
                  gameId: fortune-chimp
                  kind: REFUND
                  money: { amount: '25.00', currency: BRL }
              loss:
                summary: A lost round, which moves nothing
                value:
                  providerId: provider-a
                  externalTransactionId: transaction-125
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  walletId: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  roundId: round-988
                  gameId: fortune-chimp
                  kind: LOSS
                  money: { amount: '0.00', currency: BRL }
      responses:
        '200':
          description: The operation was processed.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessedOperation'
        '202':
          description: |
            The operation names a Reference (`referenceExternalTransactionId`) that has not
            arrived. It is stored and waits for it, trying again with growing gaps for up to 10
            attempts or 15 minutes. It ends as `PROCESSED`, or as `REJECTED` with
            `REFERENCE_NOT_FOUND` (the Reference never appeared) or `REFERENCE_NOT_PROCESSED`
            (it appeared and never completed). Read the result with
            `GET /wagering/transactions/{transactionId}`. Sending it again answers `202` with the
            same `transactionId` while it waits, and the final answer after.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingOperation'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: |
            The idempotency key was used with other content (`IDEMPOTENCY_KEY_CONFLICT`),
            or the external transaction id was used under another key
            (`DUPLICATE_EXTERNAL_TRANSACTION`). Nothing was applied.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: A business rule refused the operation. The refusal is stored and final.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RejectedOperation'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wagering/transactions/{transactionId}:
    get:
      tags: [Wagering]
      operationId: getTransaction
      summary: Read a transaction by its id
      description: |
        Roles `provider` and `internal`. A provider reads only its own transactions: asking
        for another provider's, or for one that does not exist, gets the same `404`, so the
        answer tells nothing about transactions that are not yours. The internal service
        reads any, including the internal opening of a wallet.

        The response shows where the transaction is: `PENDING_REFERENCE` while it waits for
        the operation it refers to, `PROCESSED` with the balance seen when it was processed,
        `REJECTED` or `FAILED` with the `failureCode`.
      parameters:
        - name: transactionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The transaction.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: There is no such transaction among those the caller may read.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /providers/{providerId}/wagering/transactions/{externalTransactionId}:
    get:
      tags: [Wagering]
      operationId: getTransactionByExternalId
      summary: Read a provider's transaction by its external id
      description: |
        Roles `provider` and `internal`. A provider must ask under its own `providerId`
        (otherwise `403`); the internal service may ask under any. Transactions are found by
        `(providerId, externalTransactionId)`, so one provider's identifiers never reach
        another provider's transactions.
      parameters:
        - name: providerId
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9][a-z0-9._-]{0,62}$' }
        - name: externalTransactionId
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The transaction.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The provider has no such transaction.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallets:
    post:
      tags: [Wallets]
      operationId: openWallet
      summary: Open a wallet
      description: |
        Opens the wallet of a player in one currency. Role `internal`.

        With a positive `initialBalance` the wallet starts funded: the opening, its
        credit in the ledger and the events about both are recorded in the same
        database transaction. With a zero balance only the wallet is created.

        There is no idempotency key. Sending the request again after a timeout
        answers `409` with the id of the wallet that is already there, so the caller
        can confirm the result.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
            examples:
              funded:
                summary: A wallet opened with 100.00 BRL
                value:
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  initialBalance: { amount: '100.00', currency: BRL }
              empty:
                summary: An empty wallet
                value:
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  initialBalance: { amount: '0.00', currency: USD }
      responses:
        '201':
          description: The wallet was created.
          headers:
            Location:
              description: Where the wallet can be read.
              schema: { type: string }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The player already has a wallet in that currency.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletConflictError'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallets/{walletId}:
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Read a wallet
      description: Role `internal`.
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The wallet.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: There is no wallet with that id.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallets/{walletId}/ledger:
    get:
      tags: [Wallets]
      operationId: listLedger
      summary: List a wallet's ledger
      description: |
        Role `internal`. The ledger is read oldest entry first, a page at a time, and
        includes the opening credit of a funded wallet.

        `nextCursor` is opaque: pass it back as `cursor` to get the next page, and do not
        build or change one. A walk that follows the cursors to the end sees every entry
        once, in the order they were written, even while new entries are being written:
        the cursor marks a position in the wallet's sequence, not a time.
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: cursor
          in: query
          required: false
          description: The `nextCursor` of the previous page. Absent for the first page. A cursor of another wallet, or one that is not a cursor, is `400`.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          required: false
          description: Entries per page, from 1 to 200.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: A page of the ledger.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: There is no wallet with that id.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallets/{walletId}/reconciliation:
    post:
      tags: [Wallets]
      operationId: reconcileWallet
      summary: Check a wallet's books
      description: |
        Role `internal`. Rebuilds the balance from the ledger (credits minus debits, the
        opening credit included) and compares it with the balance the wallet stores. The
        two are read in one consistent snapshot, so writes going on at the same time cannot
        make them disagree. The wallet and its ledger are never changed.

        By default (`mode=full`) every check reads the whole ledger, and also checks the
        wallet's last checkpoint against it (`checkpointMatches`); a checkpoint that does
        not match makes the books inconsistent. A check that finds the books consistent
        records a checkpoint through the last entry; checkpoints are computed by the
        database from the ledger itself, never by the caller. `mode=incremental` continues
        from the last checkpoint and reads only the entries recorded after it, so its cost
        follows what happened since the last check, not the size of the ledger; it trusts
        the checkpoint.

        The answer is `200` also when the books do not agree: a divergence is what the
        check found, not a problem with the request. It is reported in `consistent: false`
        and `difference`, logged as an error and counted in `reconciliation_divergences_total`.
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: mode
          in: query
          required: false
          description: '`full` (the default) reads the whole ledger and checks the last checkpoint; `incremental` continues from it. Given at most once.'
          schema: { type: string, enum: [full, incremental], default: full }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The result of the check.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResult'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: There is no wallet with that id.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /health/live:
    get:
      tags: [Operations]
      operationId: live
      summary: Liveness
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /health/ready:
    get:
      tags: [Operations]
      operationId: ready
      summary: Readiness
      description: Whether the instance can serve traffic (PostgreSQL and SQS reachable, not draining).
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Prometheus metrics
      description: |
        Role `monitoring` only: the client `metrics-scraper`. A Prometheus server
        scrapes it with its `oauth2` client credentials configuration (see README).
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /openapi.yaml:
    get:
      tags: [Operations]
      operationId: openapi
      summary: This document
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: object
                description: This document, as YAML.

components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: |
        Token from Keycloak with the `client_credentials` grant. The local clients are
        `provider-a`, `provider-b` (role `provider`), `internal-service` (role
        `internal`) and `metrics-scraper` (role `monitoring`); their secrets are in
        the README.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/wagering/protocol/openid-connect/token
          scopes: {}

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Identifies the operation. 1 to 255 printable ASCII characters without spaces.
        It may be built as `{providerId}:{externalTransactionId}`; the server keeps the
        one it receives and never replaces it.
      schema: { type: string, pattern: '^[!-~]{1,255}$' }
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identifies the request across logs and events. Up to 128 printable ASCII
        characters; one is generated when absent or not acceptable. It is returned in
        the response header of the same name.
      schema: { type: string, maxLength: 128 }

  headers:
    CorrelationId:
      description: The correlation id of the request, as given or as generated.
      schema: { type: string }

  schemas:
    Money:
      type: object
      description: |
        An amount with its currency. `amount` is always a string with exactly two
        decimals, never a number: `25.00` is valid; `25`, `25.5`, `-1.00` and `1e3`
        are not.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          example: '100.00'
        currency:
          type: string
          enum: [BRL, USD, EUR]

    OpenWalletRequest:
      type: object
      required: [playerId, initialBalance]
      additionalProperties: false
      properties:
        playerId: { type: string, format: uuid }
        initialBalance:
          $ref: '#/components/schemas/Money'

    Wallet:
      type: object
      required: [id, playerId, balance, version]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        balance:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and rises by one with each change of the balance.

    OperationRequest:
      type: object
      required: [providerId, externalTransactionId, playerId, walletId, roundId, gameId, kind, money]
      additionalProperties: false
      properties:
        providerId:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,62}$'
          description: Must be the provider the token belongs to.
        externalTransactionId:
          type: string
          minLength: 1
          maxLength: 128
        playerId: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        roundId: { type: string, minLength: 1, maxLength: 128 }
        gameId: { type: string, minLength: 1, maxLength: 128 }
        kind:
          type: string
          enum: [BET, WIN, LOSS, REFUND, ROLLBACK]
          description: |
            `BET` debits. `WIN` credits (a credit the balance could not hold is refused with
            `BALANCE_LIMIT_EXCEEDED`). `LOSS` moves nothing and needs `0.00`. `REFUND` and
            `ROLLBACK` reverse an earlier operation and need `referenceExternalTransactionId`.
            `OPENING` is not accepted.
        money:
          $ref: '#/components/schemas/Money'
        referenceExternalTransactionId:
          type: string
          minLength: 1
          maxLength: 128
          description: |
            Required for `REFUND` and `ROLLBACK`, optional for `WIN`, not allowed otherwise.
            It is the external id of an earlier operation of the same provider.

    PendingOperation:
      type: object
      required: [transactionId, status, idempotentReplay]
      properties:
        transactionId: { type: string, format: uuid }
        status: { type: string, enum: [PENDING_REFERENCE] }
        idempotentReplay: { type: boolean }

    ProcessedOperation:
      type: object
      required: [transactionId, status, balance, idempotentReplay]
      properties:
        transactionId: { type: string, format: uuid }
        status: { type: string, enum: [PROCESSED] }
        balance:
          $ref: '#/components/schemas/Money'
        idempotentReplay:
          type: boolean
          description: True when the stored result of an earlier identical request is being returned.

    RejectedOperation:
      type: object
      required: [transactionId, status, failureCode, idempotentReplay]
      properties:
        transactionId: { type: string, format: uuid }
        status: { type: string, enum: [REJECTED] }
        failureCode:
          type: string
          description: |
            Why the operation was refused. Correctable (`CURRENCY_MISMATCH`, `PLAYER_MISMATCH`,
            `REFERENCE_KIND_INVALID`, `REFERENCE_MISMATCH`, `REFERENCE_AMOUNT_MISMATCH`): the data
            sent is at fault. Definitive: a business result that sending again does not change.
          enum:
            - INSUFFICIENT_FUNDS
            - BALANCE_LIMIT_EXCEEDED
            - REVERSAL_INSUFFICIENT_FUNDS
            - WALLET_NOT_FOUND
            - CURRENCY_MISMATCH
            - PLAYER_MISMATCH
            - REFERENCE_NOT_FOUND
            - REFERENCE_NOT_PROCESSED
            - REFERENCE_KIND_INVALID
            - REFERENCE_MISMATCH
            - REFERENCE_AMOUNT_MISMATCH
            - REFERENCE_ALREADY_REVERSED
        idempotentReplay: { type: boolean }

    Transaction:
      type: object
      required: [transactionId, status, kind, playerId, walletId, money, createdAt, updatedAt]
      properties:
        transactionId: { type: string, format: uuid }
        status:
          type: string
          enum: [PENDING, PENDING_REFERENCE, PROCESSED, REJECTED, FAILED]
        kind:
          type: string
          enum: [OPENING, BET, WIN, LOSS, REFUND, ROLLBACK]
        providerId:
          type: string
          description: Absent for the internal opening of a wallet.
        externalTransactionId:
          type: string
          description: Absent for the internal opening of a wallet.
        playerId: { type: string, format: uuid }
        walletId:
          type: string
          format: uuid
          description: The wallet the operation asked for (which may not exist, for a `WALLET_NOT_FOUND` rejection).
        roundId: { type: string }
        gameId: { type: string }
        money:
          $ref: '#/components/schemas/Money'
        referenceExternalTransactionId:
          type: string
          description: The operation this one refers to, when it names one.
        balance:
          $ref: '#/components/schemas/Money'
        failureCode:
          type: string
          description: Why the operation was rejected, or `INTERNAL_PERMANENT_FAILURE` for a failure. Present only for `REJECTED` and `FAILED`.
          enum:
            - INSUFFICIENT_FUNDS
            - BALANCE_LIMIT_EXCEEDED
            - REVERSAL_INSUFFICIENT_FUNDS
            - WALLET_NOT_FOUND
            - CURRENCY_MISMATCH
            - PLAYER_MISMATCH
            - REFERENCE_NOT_FOUND
            - REFERENCE_NOT_PROCESSED
            - REFERENCE_KIND_INVALID
            - REFERENCE_MISMATCH
            - REFERENCE_AMOUNT_MISMATCH
            - REFERENCE_ALREADY_REVERSED
            - INTERNAL_PERMANENT_FAILURE
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        processedAt:
          type: string
          format: date-time
          description: When the transaction reached its final state; absent while it has not.

    SignedMoney:
      type: object
      description: |
        Like `Money`, but the amount may be negative. Only a difference between two amounts
        can be, never a balance or an amount sent to the API.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^-?(0|[1-9][0-9]*)\.[0-9]{2}$'
          example: '-3.00'
        currency:
          type: string
          enum: [BRL, USD, EUR]

    ReconciliationResult:
      type: object
      description: |
        `calculatedBalance` is the credits minus the debits of the ledger, the opening
        included. `difference` is the stored balance minus the calculated one: zero when
        the books agree, negative when the ledger explains more than is stored.
      required: [walletId, storedBalance, calculatedBalance, difference, consistent, checkedEntries, mode, readEntries]
      properties:
        walletId: { type: string, format: uuid }
        storedBalance:
          $ref: '#/components/schemas/Money'
        calculatedBalance:
          $ref: '#/components/schemas/SignedMoney'
        difference:
          $ref: '#/components/schemas/SignedMoney'
        consistent:
          type: boolean
        checkedEntries:
          type: integer
          format: int64
          minimum: 0
          description: How many ledger entries the calculated balance accounts for, those of the checkpoint included.
        mode:
          type: string
          enum: [incremental, full]
        readEntries:
          type: integer
          format: int64
          minimum: 0
          description: How many ledger entries this check read. Fewer than `checkedEntries` when it continued from a checkpoint.
        checkpointMatches:
          type: boolean
          description: Full checks of a wallet that has a checkpoint only. Whether the last checkpoint agrees with the ledger it summarises.

    LedgerEntry:
      type: object
      required: [id, walletId, transactionId, direction, money, balanceBefore, balanceAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        walletId: { type: string, format: uuid }
        transactionId:
          type: string
          format: uuid
          description: The Wager Transaction that caused the movement.
        direction: { type: string, enum: [DEBIT, CREDIT] }
        money:
          $ref: '#/components/schemas/Money'
        balanceBefore:
          $ref: '#/components/schemas/Money'
        balanceAfter:
          $ref: '#/components/schemas/Money'
        createdAt: { type: string, format: date-time }

    LedgerPage:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LedgerEntry'
        nextCursor:
          type: string
          description: Present when there are more entries after this page; absent on the last one.

    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - WALLET_ALREADY_EXISTS
        - IDEMPOTENCY_KEY_CONFLICT
        - DUPLICATE_EXTERNAL_TRANSACTION
        - UNAVAILABLE
        - INTERNAL_ERROR

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              description: What is wrong with the request, by field.
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }

    WalletConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, walletId]
          properties:
            code: { type: string, enum: [WALLET_ALREADY_EXISTS] }
            message: { type: string }
            walletId:
              type: string
              format: uuid
              description: The wallet that is already there.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }

  responses:
    InvalidRequest:
      description: The request is malformed or has an invalid value. Nothing was created.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: The credential is missing, malformed, expired or not accepted. The body is the same for every cause.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The credential is valid but its role does not allow this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: A dependency is temporarily unavailable. Try again after the time in `Retry-After`.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: An unexpected error. Nothing was created. The correlation id identifies the request in the logs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
