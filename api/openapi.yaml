openapi: 3.0.3
info:
  title: Wagering API
  version: 0.1.0
  description: |
    Wallets and wagering transactions of the distributed betting backend.

    Every endpoint except the health checks and this document requires a bearer
    token obtained from Keycloak with the OAuth 2.0 `client_credentials` grant. The
    role the token carries (`provider` or `internal`) decides what it may call; the
    role is listed on each operation.

    This file is written by hand and is the source of truth of the HTTP contract:
    the integration tests validate every real request and response against it.
servers:
  - url: http://localhost:8081
    description: Instance app-1 of the local Compose environment
  - url: http://localhost:8082
    description: Instance app-2
  - url: http://localhost:8083
    description: Instance app-3

tags:
  - name: Wallets
    description: Opening and reading wallets. Role `internal`.
  - name: Operations
    description: Health checks and this document. No credentials needed.

security:
  - clientCredentials: []

paths:
  /wallets:
    post:
      tags: [Wallets]
      operationId: openWallet
      summary: Open a wallet
      description: |
        Opens the wallet of a player in one currency. Role `internal`.

        With a positive `initialBalance` the wallet starts funded: the opening, its
        credit in the ledger and the events about both are recorded in the same
        database transaction. With a zero balance only the wallet is created.

        There is no idempotency key. Sending the request again after a timeout
        answers `409` with the id of the wallet that is already there, so the caller
        can confirm the result.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenWalletRequest'
            examples:
              funded:
                summary: A wallet opened with 100.00 BRL
                value:
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  initialBalance: { amount: '100.00', currency: BRL }
              empty:
                summary: An empty wallet
                value:
                  playerId: 7c9e6679-7425-40de-944b-e07fc1f90ae7
                  initialBalance: { amount: '0.00', currency: USD }
      responses:
        '201':
          description: The wallet was created.
          headers:
            Location:
              description: Where the wallet can be read.
              schema: { type: string }
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: The player already has a wallet in that currency.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletConflictError'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /wallets/{walletId}:
    get:
      tags: [Wallets]
      operationId: getWallet
      summary: Read a wallet
      description: Role `internal`.
      parameters:
        - name: walletId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: The wallet.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400': { $ref: '#/components/responses/InvalidRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: There is no wallet with that id.
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500': { $ref: '#/components/responses/Internal' }
        '503': { $ref: '#/components/responses/Unavailable' }

  /health/live:
    get:
      tags: [Operations]
      operationId: live
      summary: Liveness
      security: []
      responses:
        '200':
          description: The process is running.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [ok] }

  /health/ready:
    get:
      tags: [Operations]
      operationId: ready
      summary: Readiness
      description: Whether the instance can serve traffic (PostgreSQL and SQS reachable, not draining).
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }
        '503':
          description: Not ready.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Readiness' }

  /metrics:
    get:
      tags: [Operations]
      operationId: metrics
      summary: Prometheus metrics
      description: Open on the internal network of the Compose environment (see the limitations in ARCHITECTURE.md).
      security: []
      responses:
        '200':
          description: Metrics in the Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

  /openapi.yaml:
    get:
      tags: [Operations]
      operationId: openapi
      summary: This document
      security: []
      responses:
        '200':
          description: The OpenAPI document.
          content:
            application/yaml:
              schema:
                type: object
                description: This document, as YAML.

components:
  securitySchemes:
    clientCredentials:
      type: oauth2
      description: |
        Token from Keycloak with the `client_credentials` grant. The local clients are
        `provider-a`, `provider-b` (role `provider`) and `internal-service` (role
        `internal`); their secrets are in the README.
      flows:
        clientCredentials:
          tokenUrl: http://localhost:8180/realms/wagering/protocol/openid-connect/token
          scopes: {}

  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identifies the request across logs and events. Up to 128 printable ASCII
        characters; one is generated when absent or not acceptable. It is returned in
        the response header of the same name.
      schema: { type: string, maxLength: 128 }

  headers:
    CorrelationId:
      description: The correlation id of the request, as given or as generated.
      schema: { type: string }

  schemas:
    Money:
      type: object
      description: |
        An amount with its currency. `amount` is always a string with exactly two
        decimals, never a number: `25.00` is valid; `25`, `25.5`, `-1.00` and `1e3`
        are not.
      required: [amount, currency]
      additionalProperties: false
      properties:
        amount:
          type: string
          pattern: '^(0|[1-9][0-9]*)\.[0-9]{2}$'
          example: '100.00'
        currency:
          type: string
          enum: [BRL, USD, EUR]

    OpenWalletRequest:
      type: object
      required: [playerId, initialBalance]
      additionalProperties: false
      properties:
        playerId: { type: string, format: uuid }
        initialBalance:
          $ref: '#/components/schemas/Money'

    Wallet:
      type: object
      required: [id, playerId, balance, version]
      properties:
        id: { type: string, format: uuid }
        playerId: { type: string, format: uuid }
        balance:
          $ref: '#/components/schemas/Money'
        version:
          type: integer
          format: int64
          minimum: 1
          description: Starts at 1 and rises by one with each change of the balance.

    ErrorCode:
      type: string
      enum:
        - INVALID_REQUEST
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - WALLET_ALREADY_EXISTS
        - UNAVAILABLE
        - INTERNAL_ERROR

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { $ref: '#/components/schemas/ErrorCode' }
            message: { type: string }
            details:
              type: array
              description: What is wrong with the request, by field.
              items:
                type: object
                required: [field, issue]
                properties:
                  field: { type: string }
                  issue: { type: string }

    WalletConflictError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, walletId]
          properties:
            code: { type: string, enum: [WALLET_ALREADY_EXISTS] }
            message: { type: string }
            walletId:
              type: string
              format: uuid
              description: The wallet that is already there.

    Readiness:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, unavailable] }
        checks:
          type: object
          additionalProperties: { type: string }

  responses:
    InvalidRequest:
      description: The request is malformed or has an invalid value. Nothing was created.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthenticated:
      description: The credential is missing, malformed, expired or not accepted. The body is the same for every cause.
      headers:
        WWW-Authenticate:
          schema: { type: string, enum: [Bearer] }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The credential is valid but its role does not allow this operation.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: A dependency is temporarily unavailable. Try again after the time in `Retry-After`.
      headers:
        Retry-After:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Internal:
      description: An unexpected error. Nothing was created. The correlation id identifies the request in the logs.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
