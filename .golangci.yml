version: "2"

run:
  # Lint the tagged test code and the fault points too, not only the default build.
  build-tags:
    - integration
    - multiinstance
    - faultinject

# Curated on purpose: every linter below targets a risk this project is graded
# on (ARCHITECTURE.md, section 18). Enabling everything would bury those in noise.
linters:
  default: none
  enable:
    # Errors must be handled and classified with errors.Is/As, never ignored
    # or compared by string or ==.
    - errcheck
    - errorlint
    # General correctness, dead code and no-op assignments.
    - staticcheck
    - unused
    - ineffassign
    # All I/O takes a context.Context so it honours cancellation and timeouts.
    - noctx
    # database/sql rows and statements closed and their errors checked.
    # Note: they do not understand pgx; pgx rows are covered by review and by
    # the integration tests.
    - rowserrcheck
    - sqlclosecheck
    # HTTP response bodies closed.
    - bodyclose
    # Security smells.
    - gosec
  settings:
    gosec:
      excludes:
        # G104 (unhandled errors) duplicates errcheck, which is configured above.
        - G104
